{% extends "base.html" %}
{% block title %}GenMedix - Secure Login{% endblock %}

{% block content %}
<style>
    /* Unique Auth Background matching the Homepage */
    .auth-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        margin-top: -24px; /* Pull up to navbar */
    }
    .auth-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.4;
        z-index: 1;
    }
    .orb-left { width: 400px; height: 400px; background: #3b82f6; top: -100px; left: -100px; }
    .orb-right { width: 500px; height: 500px; background: #10b981; bottom: -100px; right: -100px; }
    
    .auth-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 450px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        padding: 40px;
    }
    .floating-icon-input { position: relative; }
    .floating-icon-input i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: var(--text-muted); }
    .floating-icon-input .form-control { 
        padding-left: 45px; 
        height: 55px; 
        border-radius: 12px;
        background-color: var(--input-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }
    .floating-icon-input .form-control:focus {
        background-color: var(--bg-card);
        border-color: var(--primary-accent);
    }
</style>

<div class="auth-wrapper">
    <div class="auth-orb orb-left"></div>
    <div class="auth-orb orb-right"></div>
    
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle text-primary mb-3" style="width: 60px; height: 60px;">
                <i class="fas fa-user-md fs-3"></i>
            </div>
            <h3 class="fw-bolder text-dark">Physician Portal</h3>
            <p class="text-muted small">Enter your credentials to access the CDSS.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small text-dark">Institutional Email</label>
                <div class="floating-icon-input">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" name="email" placeholder="doctor@hospital.org" required>
                </div>
            </div>
            
            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <label class="form-label fw-bold small text-dark">Secure Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="small text-primary text-decoration-none fw-bold">Forgot Password?</a>
                </div>
                <div class="floating-icon-input">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm" style="height: 55px; border-radius: 12px;">
                Authenticate <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none">Request Access</a></p>
        </div>
    </div>
</div>
{% endblock %}
