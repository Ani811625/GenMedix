{% extends "base.html" %}
{% block title %}Log In - GenMedix{% endblock %}

{% block content %}
<div class="auth-container-centered">
    <div class="auth-box">
        <div class="text-center mb-4" style="padding-top: 50px;">
            <img src="{{ url_for('static', filename='assets/images/image.png') }}" alt="GenMedix" height="48" class="mb-3">
            <h3 class="fw-bold text-secondary">Welcome Back</h3>
            <p class="text-muted small">Sign in to your clinical dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="name@hospital.org" required>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <label class="form-label">Password</label>
                    <a href="#" class="text-decoration-none small fw-bold">Forgot password?</a>
                </div>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">Sign In</button>
            
            <div class="text-center border-top pt-3">
                <span class="text-muted small">No account yet?</span>
                <a href="{{ url_for('register') }}" class="fw-bold small ms-1">Register as Clinician</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
