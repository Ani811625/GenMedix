{% extends "base.html" %}
{% block title %}Log In - GenMedix{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='assets/images/image.png') }}" alt="Logo" height="40" class="mb-3">
            <h2>Welcome Back</h2>
            <p class="text-muted">Securely access your clinical dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" name="email" placeholder="doctor@hospital.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">Log In</button>
            
            <div class="text-center small">
                <span class="text-muted">Don't have an account?</span>
                <a href="{{ url_for('register') }}" class="fw-bold ms-1">Request Access</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
