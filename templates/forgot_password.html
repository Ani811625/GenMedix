{% extends "base.html" %}
{% block title %}Reset Password - GenMedix{% endblock %}

{% block content %}
<style>
    .sec-wrapper { min-height: calc(100vh - 76px); display: flex; align-items: center; justify-content: center; background-color: #f8fafc; padding: 20px; }
    .sec-card { max-width: 420px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; background: #fff; padding: 40px; }
</style>

<div class="sec-wrapper">
    <div class="sec-card text-center">
        <div class="mb-4">
            <i class="fas fa-shield-alt text-primary fs-1 mb-3"></i>
            <h4 class="fw-bold text-dark">Account Recovery</h4>
            <p class="text-muted small">Enter your registered email address to receive a secure One-Time Password (OTP).</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-floating mb-4 text-start">
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                <label for="email">Registered Email</label>
            </div>

            <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm mb-3">Send Secure OTP</button>
            <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
        </form>
    </div>
</div>
{% endblock %}
