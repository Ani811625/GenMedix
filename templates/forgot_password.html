{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow border-0" style="width: 100%; max-width: 450px; border-radius: 12px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">GenMedix</h2>
                <h5 class="text-muted">Password Recovery</h5>
            </div>
            
            <p class="text-center text-muted mb-4" style="font-size: 0.95rem;">
                Enter your registered email address and we will send you a secure One-Time Password (OTP) to reset your password.
            </p>

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="mb-4">
                    <label for="email" class="form-label fw-bold text-secondary">Email Address</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="doctor@hospital.com" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Send OTP</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-decoration-none text-muted">← Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
