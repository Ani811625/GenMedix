{% extends "base.html" %}
{% block title %}Register - GenMedix{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='assets/images/image.png') }}" alt="Logo" height="40" class="mb-3">
            <h2>Clinician Registration</h2>
            <p class="text-muted">Create your secure workspace</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Full Name (Dr.)</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Medical Registration ID</label>
                    <input type="text" class="form-control" name="medical_reg_id" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="password_confirm" required>
                </div>
            </div>

            <div class="form-check mt-3 mb-4">
                <input class="form-check-input" type="checkbox" required>
                <label class="form-check-label small text-muted">
                    I agree to the <a href="#">Terms of Service</a> and confirm I am a licensed medical professional.
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Create Account</button>
            
            <div class="text-center small">
                <span class="text-muted">Already have an account?</span>
                <a href="{{ url_for('login') }}" class="fw-bold ms-1">Log In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
