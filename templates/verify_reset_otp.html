{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow border-0" style="width: 100%; max-width: 450px; border-radius: 12px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">GenMedix</h2>
                <h5 class="text-muted">Security Check</h5>
            </div>
            
            <div class="alert alert-info text-center mb-4" role="alert" style="font-size: 0.9rem;">
                We've sent a 6-digit secure code to <br><strong>{{ email }}</strong>
            </div>

            <form method="POST" action="{{ url_for('verify_reset_otp') }}">
                <div class="mb-4 text-center">
                    <label for="otp" class="form-label fw-bold text-secondary">Enter OTP</label>
                    <input type="text" class="form-control form-control-lg text-center fw-bold text-primary shadow-sm" 
                           id="otp" name="otp" required autocomplete="off" maxlength="6" 
                           placeholder="· · · · · ·" style="font-size: 1.5rem; letter-spacing: 8px;">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Verify Identity</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-muted">Use a different email</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
