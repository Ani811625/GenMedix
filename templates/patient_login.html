{% extends "base.html" %}
{% block title %}Patient Portal - GenMedix{% endblock %}

{% block content %}
<div class="central-layout-wrapper" style="align-items: center;">
    <div class="central-card auth-card-width" style="border-top: 5px solid #00875a;"> <div class="text-center mb-4">
            <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                <i class="fas fa-user-injured"></i>
            </div>
            <h3 class="h4 fw-bold text-secondary">Patient Portal</h3>
            <p class="text-muted small">View your medical history and reports securely.</p>
        </div>

        <form method="POST" action="{{ url_for('patient_login') }}">
            <div class="mb-3">
                <label class="form-label">Aadhar ID (Username)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-fingerprint"></i></span>
                    <input type="text" class="form-control fw-bold" id="pAadhar" name="aadhar" 
                           placeholder="0000 0000 0000" maxlength="14" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Date of Birth (Password)</label>
                <input type="date" class="form-control" name="dob" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3">Access Records</button>
            
            <div class="text-center pt-3 border-top">
                <a href="{{ url_for('login') }}" class="small fw-bold text-decoration-none text-primary">Are you a Doctor? Login here</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('pAadhar').addEventListener('input', function (e) {
        var target = e.target;
        var input = target.value.replace(/\D/g, '').substring(0,12);
        var zip = input.substring(0,4);
        if(input.length > 4){zip = zip + ' ' + input.substring(4,8);}
        if(input.length > 8){zip = zip + ' ' + input.substring(8,12);}
        target.value = zip;
    });
</script>
{% endblock %}
