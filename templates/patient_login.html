{% extends "base.html" %}
{% block title %}Patient Portal - GenMedix{% endblock %}

{% block content %}
<style>
    /* Soft, calming clinical gradient for patients */
    .patient-wrapper { min-height: calc(100vh - 76px); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); padding: 20px; }
    .patient-card { max-width: 450px; width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 40px; }
</style>

<div class="patient-wrapper">
    <div class="patient-card text-center">
        
        <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
            <i class="fas fa-notes-medical fs-2"></i>
        </div>
        
        <h3 class="fw-bolder text-dark mb-1">Patient Portal</h3>
        <p class="text-muted small mb-4">Access your AI dosage reports securely.</p>

        <form method="POST" action="{{ url_for('patient_login') }}">
            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control bg-light" id="aadhar" name="aadhar" placeholder="1234 5678 9012" required>
                <label for="aadhar"><i class="fas fa-id-card me-2"></i>Aadhar Number</label>
            </div>
            
            <div class="form-floating mb-4 text-start">
                <input type="date" class="form-control bg-light text-muted" id="dob" name="dob" required>
                <label for="dob"><i class="fas fa-calendar-alt me-2"></i>Date of Birth</label>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3" style="border-radius: 10px;">
                Access Records <i class="fas fa-arrow-right ms-2"></i>
            </button>
            
            <p class="text-muted small mt-4 mb-0"><i class="fas fa-lock text-success me-1"></i> Encrypted Health Data Access</p>
        </form>

    </div>
</div>
{% endblock %}
