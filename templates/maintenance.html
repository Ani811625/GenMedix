<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Offline - GenMedix</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .container { max-width: 500px; padding: 40px; border: 1px solid #333; border-radius: 8px; background: #0a0a0a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-weight: 700; margin-bottom: 10px; font-size: 1.5rem; letter-spacing: -0.5px; }
        p { color: #a1a1aa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 30px; }
        .timer-box { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .time-block { background: #18181b; border: 1px solid #27272a; padding: 15px; border-radius: 6px; width: 70px; }
        .time-val { font-size: 1.8rem; font-weight: 800; display: block; color: #fff; }
        .time-label { font-size: 0.65rem; text-transform: uppercase; color: #71717a; letter-spacing: 1px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        
        <h1>{{ m_title }}</h1>
        <p>{{ m_message }}</p>
        
        <div class="timer-box" id="timerContainer" style="display: none;">
            <div class="time-block"><span class="time-val" id="days">00</span><span class="time-label">Days</span></div>
            <div class="time-block"><span class="time-val" id="hours">00</span><span class="time-label">Hours</span></div>
            <div class="time-block"><span class="time-val" id="mins">00</span><span class="time-label">Mins</span></div>
            <div class="time-block"><span class="time-val" id="secs">00</span><span class="time-label">Secs</span></div>
        </div>
        
        <input type="hidden" id="targetTime" value="{{ end_time }}">
    </div>

    <script>
        const targetStr = document.getElementById('targetTime').value;
        if (targetStr && targetStr !== 'None') {
            document.getElementById('timerContainer').style.display = 'flex';
            const targetDate = new Date(targetStr).getTime();

            const interval = setInterval(function() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    clearInterval(interval);
                    document.getElementById('timerContainer').innerHTML = "<p style='color:#10b981; font-weight:bold; font-size:0.9rem;'>Updates Complete. Awaiting System Restart.</p>";
                    return;
                }

                document.getElementById('days').innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById('hours').innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById('mins').innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                document.getElementById('secs').innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
            }, 1000);
        }
    </script>
</body>
</html>
