{% extends "base.html" %}
{% block content %}

<style>
    /* Modern Skeleton Loader Overlay */
    #aiLoadingOverlay {
        display: none; /* Hidden by default */
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(248, 249, 250, 0.97); /* Very clean, light background */
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        padding-top: 6vh;
        backdrop-filter: blur(8px);
    }
    
    .loading-status-text {
        font-size: 1.5rem;
        font-weight: 800;
        color: #0d6efd;
        margin-bottom: 25px;
        letter-spacing: 0.5px;
        text-align: center;
    }

    /* Skeleton Card mimicking the final PDF */
    .skeleton-card {
        width: 90%;
        max-width: 850px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.06);
        padding: 40px;
        border: 1px solid #e2e8f0;
    }

    /* The Pulsing Animation */
    .skeleton-box {
        background: #e2e8f0;
        border-radius: 6px;
        animation: pulse 1.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
        0% { opacity: 0.5; }
        50% { opacity: 1; }
        100% { opacity: 0.5; }
    }

    /* Specific Skeleton Shapes */
    .skel-header { height: 35px; width: 35%; margin-bottom: 40px; }
    .skel-row { display: flex; gap: 30px; margin-bottom: 30px; }
    .skel-col { flex: 1; }
    .skel-text { height: 16px; width: 100%; margin-bottom: 15px; }
    .skel-text-short { height: 16px; width: 60%; margin-bottom: 15px; }
    .skel-dosage-box { height: 140px; width: 100%; margin-bottom: 40px; border-radius: 12px; }
    .skel-chart-box { height: 220px; width: 100%; border-radius: 12px; }
</style>

<div id="aiLoadingOverlay">
    <div class="loading-status-text" id="loadingText">Initializing AI Engine...</div>
    
    <div class="skeleton-card">
        <div class="skeleton-box skel-header"></div>
        
        <div class="skel-row">
            <div class="skel-col">
                <div class="skeleton-box skel-text"></div>
                <div class="skeleton-box skel-text"></div>
                <div class="skeleton-box skel-text-short"></div>
            </div>
            <div class="skel-col">
                <div class="skeleton-box skel-text"></div>
                <div class="skeleton-box skel-text"></div>
                <div class="skeleton-box skel-text-short"></div>
            </div>
        </div>
        
        <div class="skeleton-box skel-dosage-box"></div>
        
        <div class="skel-row mb-0">
            <div class="skel-col">
                <div class="skeleton-box skel-chart-box"></div>
            </div>
            <div class="skel-col">
                <div class="skeleton-box skel-chart-box"></div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4 mb-5">
    <div class="card shadow border-0" style="border-radius: 12px; max-width: 900px; margin: auto;">
        <div class="card-header bg-primary text-white p-4" style="border-radius: 12px 12px 0 0;">
            <h3 class="mb-0"><i class="fas fa-brain"></i> AI Warfarin Dosing Model</h3>
            <p class="mb-0 text-light opacity-75">Patient: <strong>{{ patient.full_name }}</strong> | Aadhar: {{ patient.aadhar }}</p>
        </div>
        
        <div class="card-body p-5">
            <form id="warfarinForm" method="POST" action="{{ url_for('generate_warfarin_report', patient_id=patient.id) }}">
                
                <input type="hidden" name="patient_name" value="{{ patient.full_name }}">
                <input type="hidden" name="patient_dob" value="{{ patient.dob }}">
                <input type="hidden" name="patient_gender" value="{{ patient.gender }}">
                <input type="hidden" name="patient_country" value="{{ patient.country }}">
                <input type="hidden" name="patient_address" value="{{ patient.address }}">
                <input type="hidden" name="doctor_name" value="{{ current_user.full_name }}">

                <div class="row">
                    <div class="col-md-6 mb-4 pe-md-4">
                        <h5 class="text-secondary fw-bold border-bottom pb-2 mb-4">Clinical Parameters</h5>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Age (Years)</label>
                            <input type="number" class="form-control" name="Age" value="{{ calculated_age }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Height (cm)</label>
                            <input type="number" step="0.1" class="form-control" name="Height__cm_" placeholder="e.g. 170.5" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Weight (kg)</label>
                            <input type="number" step="0.1" class="form-control" name="Weight__kg_" placeholder="e.g. 75.0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Race / Ethnicity</label>
                            <select class="form-select" name="Race" required>
                                <option value="" disabled selected>Select Ethnicity...</option>
                                <option value="Race_White">White</option>
                                <option value="Race_Black">Black or African American</option>
                                <option value="Race_Asian">Asian</option>
                                <option value="Race_Unknown">Unknown / Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4 ps-md-4 border-md-start">
                        <h5 class="text-secondary fw-bold border-bottom pb-2 mb-4">Genomic Data</h5>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">CYP2C9 Genotype <span class="badge bg-light text-secondary border ms-2">Optional</span></label>
                            <select class="form-select" name="CYP2C9_genotypes">
                                <option value="">Not Tested</option>
                                <option value="CYP2C9_genotypes__1__1">*1/*1 (Normal Metabolizer)</option>
                                <option value="CYP2C9_genotypes__1__2">*1/*2 (Intermediate)</option>
                                <option value="CYP2C9_genotypes__1__3">*1/*3 (Intermediate)</option>
                                <option value="CYP2C9_genotypes__2__2">*2/*2 (Poor Metabolizer)</option>
                                <option value="CYP2C9_genotypes__2__3">*2/*3 (Poor Metabolizer)</option>
                                <option value="CYP2C9_genotypes__3__3">*3/*3 (Poor Metabolizer)</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">VKORC1 Genotype <span class="badge bg-light text-secondary border ms-2">Optional</span></label>
                            <select class="form-select" name="VKORC1_genotype">
                                <option value="">Not Tested</option>
                                <option value="VKORC1_genotype_G_G">G/G (Normal Sensitivity)</option>
                                <option value="VKORC1_genotype_A_G">A/G (High Sensitivity)</option>
                                <option value="VKORC1_genotype_A_A">A/A (Highest Sensitivity)</option>
                            </select>
                        </div>
                        
                        <div class="p-3 bg-danger bg-opacity-10 border border-danger rounded">
                            <h6 class="text-danger fw-bold mb-2"><i class="fas fa-exclamation-triangle"></i> Safety Check</h6>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_pregnant" id="pregnantCheck">
                                <label class="form-check-label fw-bold text-dark" for="pregnantCheck">Patient is Pregnant</label>
                            </div>
                            <div class="form-check mt-1">
                                <input class="form-check-input" type="checkbox" name="active_bleeding" id="bleedingCheck">
                                <label class="form-check-label fw-bold text-dark" for="bleedingCheck">Active Bleeding Detected</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-12 border rounded p-4 bg-light shadow-sm">
                        <h5 class="text-secondary fw-bold mb-3"><i class="fas fa-pills"></i> Concomitant Medications (Drug Interactions)</h5>
                        
                        <div id="ddiWarnings" class="mb-4 p-2 rounded" style="min-height: 45px; background: #fff; border: 1px dashed #ccc;">
                            </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-check mb-2">
                                    <input class="form-check-input ddi-checkbox" type="checkbox" name="interacting_drugs" value="Amiodarone" id="drugAmiodarone" data-risk="severe">
                                    <label class="form-check-label fw-bold" for="drugAmiodarone">Amiodarone</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input ddi-checkbox" type="checkbox" name="interacting_drugs" value="Fluconazole" id="drugFluconazole" data-risk="severe">
                                    <label class="form-check-label fw-bold" for="drugFluconazole">Fluconazole</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check mb-2">
                                    <input class="form-check-input ddi-checkbox" type="checkbox" name="interacting_drugs" value="Bactrim" id="drugBactrim" data-risk="severe">
                                    <label class="form-check-label fw-bold" for="drugBactrim">TMP/SMX (Bactrim)</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input ddi-checkbox" type="checkbox" name="interacting_drugs" value="Rifampin" id="drugRifampin" data-risk="moderate">
                                    <label class="form-check-label fw-bold" for="drugRifampin">Rifampin</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check mb-2">
                                    <input class="form-check-input ddi-checkbox" type="checkbox" name="interacting_drugs" value="Carbamazepine" id="drugCarbamazepine" data-risk="moderate">
                                    <label class="form-check-label fw-bold" for="drugCarbamazepine">Carbamazepine</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow">
                        <i class="fas fa-microchip me-2"></i> Generate AI Dosage Report
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // --- FEATURE 4: Live Drug Interaction Badges ---
    const checkboxes = document.querySelectorAll('.ddi-checkbox');
    const warningContainer = document.getElementById('ddiWarnings');

    function updateWarnings() {
        warningContainer.innerHTML = ''; 
        let hasWarnings = false;

        checkboxes.forEach(box => {
            if (box.checked) {
                hasWarnings = true;
                const drugName = box.value;
                const riskLevel = box.getAttribute('data-risk');
                
                // Create the badge visually
                const badge = document.createElement('span');
                badge.className = `badge ${riskLevel === 'severe' ? 'bg-danger' : 'bg-warning text-dark'} me-2 p-2 shadow-sm`;
                badge.style.fontSize = '0.9rem';
                
                let icon = riskLevel === 'severe' ? '<i class="fas fa-skull-crossbones me-1"></i>' : '<i class="fas fa-exclamation-triangle me-1"></i>';
                let riskText = riskLevel === 'severe' ? 'SEVERE RISK' : 'MODERATE RISK';
                
                badge.innerHTML = `${icon} ${drugName} (${riskText})`;
                warningContainer.appendChild(badge);
            }
        });

        // Default state if nothing is selected
        if (!hasWarnings) {
            warningContainer.innerHTML = '<span class="text-muted" style="line-height: 28px;"><i class="fas fa-check-circle text-success me-1"></i> No major interacting drugs selected.</span>';
        }
    }

    // Initialize the warnings area and add listeners to all checkboxes
    updateWarnings();
    checkboxes.forEach(box => box.addEventListener('change', updateWarnings));

    // --- FEATURE 3: Loading AI Overlay ---
    const form = document.getElementById('warfarinForm');
    const overlay = document.getElementById('aiLoadingOverlay');
    const loadingText = document.getElementById('loadingText');

    // These phrases will cycle to make the AI look like it's "thinking"
    const phrases = [
        "Analyzing Clinical Data...",
        "Processing Pharmacogenomic Markers...",
        "Calculating SHAP Explainability Values...",
        "Verifying Statistical Confidence...",
        "Generating Encrypted PDF Report..."
    ];

    form.addEventListener('submit', function() {
        // 1. Show the full screen overlay
        overlay.style.display = 'flex';
        
        // 2. Cycle the text every 1.5 seconds while the browser waits for Flask/Weasyprint to finish
        let i = 0;
        setInterval(() => {
            if (i < phrases.length) {
                loadingText.innerText = phrases[i];
                i++;
            }
        }, 1500);
    });
</script>
{% endblock %}
