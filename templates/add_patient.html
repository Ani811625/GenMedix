{% extends "base.html" %}
{% block title %}Add Patient - GenMedix{% endblock %}

{% block content %}
<div class="central-layout-wrapper">
    <div class="central-card">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom" style="padding-top: 50px;">
            <div>
                <h4 class="mb-1 text-secondary fw-bold">New Patient Registration</h4>
                <p class="text-muted small mb-0">Create a digital health record.</p>
            </div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('add_patient') }}">
            
            <div class="mb-4">
                <h6 class="text-uppercase text-primary fw-bold mb-3 small" style="letter-spacing: 1px;">Identity & Demographics</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Aadhar ID (UIDAI)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                            <input type="text" class="form-control" name="aadhar" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" name="dob" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="gender" required>
                            <option value="" selected disabled>Select...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <h6 class="text-uppercase text-primary fw-bold mb-3 small" style="letter-spacing: 1px;">Location Details</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Country</label>
                        <select class="form-select" name="country" required>
                            <option value="India">India</option>
                            <option value="USA">USA</option>
                            <option value="UK">UK</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Residential Address</label>
                        <textarea class="form-control" name="address" rows="2" placeholder="Street, City, State"></textarea>
                    </div>
                </div>
            </div>

            <div class="text-end pt-3 border-top">
                <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                    <i class="fas fa-save me-2"></i> Save Record
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
