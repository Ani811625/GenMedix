{% extends "base.html" %}
{% block title %}Register Patient - GenMedix{% endblock %}

{% block content %}
<style>
    /* Internal CSS to force the Central Box Layout */
    body { background-color: #f4f5f7 !important; }
    
    .central-wrapper {
        display: flex;
        justify-content: center;
        padding-top: 40px;
        padding-bottom: 60px;
    }
    
    .central-card {
        background: white;
        width: 100%;
        max-width: 850px; /* Wide enough for clinical data */
        padding: 40px 50px;
        border-radius: 8px;
        border: 1px solid #dfe1e6;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .section-title {
        color: #0052cc;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 20px;
        border-bottom: 1px solid #ebecf0;
        padding-bottom: 8px;
        margin-top: 10px;
    }

    .form-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: #6b778c;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .form-control, .form-select {
        background-color: #FAFBFC;
        border: 1px solid #dfe1e6;
        padding: 10px 12px;
        font-size: 0.95rem;
        border-radius: 4px;
    }
    .form-control:focus {
        background-color: #fff;
        border-color: #0052cc;
        box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
    }

    .btn-primary {
        background-color: #0052cc;
        border: none;
        padding: 12px 30px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .btn-outline-secondary {
        border-color: #dfe1e6;
        color: #172b4d;
    }
</style>

<div class="central-wrapper">
    <div class="central-card">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h3 class="fw-bold text-secondary mb-1">New Patient Record</h3>
                <p class="text-muted small mb-0">Enter comprehensive clinical details.</p>
            </div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
        </div>

        <form method="POST" action="{{ url_for('add_patient') }}">
            
            <div class="section-title"><i class="fas fa-id-card me-2"></i> Identity & Demographics</div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-primary">Aadhar ID (UIDAI)</label>
                    <input type="text" class="form-control fw-bold text-primary" id="aadharInput" name="aadhar" 
                           placeholder="0000 0000 0000" maxlength="14" required>
                    <div class="form-text small" style="font-size: 11px;">Must be 12 digits. Spaces added automatically.</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" name="dob" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Blood Group</label>
                    <select class="form-select" name="blood_group">
                        <option value="">Unknown</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>

            <div class="section-title" style="color: #d97008;"><i class="fas fa-notes-medical me-2"></i> Clinical Profile</div>
            <div class="row g-3 mb-4">
                <div class="col-md-12">
                    <label class="form-label">Known Allergies</label>
                    <input type="text" class="form-control" name="allergies" placeholder="e.g. Penicillin, Peanuts (Leave blank if none)">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Current Medications</label>
                    <textarea class="form-control" name="current_medications" rows="2" placeholder="List existing prescriptions..."></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Medical History</label>
                    <textarea class="form-control" name="medical_history" rows="2" placeholder="Major surgeries, chronic conditions..."></textarea>
                </div>
            </div>

            <div class="section-title"><i class="fas fa-map-marker-alt me-2"></i> Contact Information</div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" name="phone" placeholder="+91...">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Emergency Contact (Kin)</label>
                    <input type="text" class="form-control" name="emergency_contact" placeholder="Name & Phone">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" placeholder="Residential Address">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Country</label>
                    <select class="form-select" name="country">
                        <option value="India" selected>India</option>
                        <option value="USA">USA</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="text-end pt-3 border-top">
                <button type="submit" class="btn btn-primary shadow-sm">
                    <i class="fas fa-save me-2"></i> Save Patient Record
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Auto-format Aadhar: 1234 5678 9012
    document.getElementById('aadharInput').addEventListener('input', function (e) {
        var target = e.target;
        var input = target.value.replace(/\D/g, '').substring(0,12);
        var zip = input.substring(0,4);
        if(input.length > 4){zip = zip + ' ' + input.substring(4,8);}
        if(input.length > 8){zip = zip + ' ' + input.substring(8,12);}
        target.value = zip;
    });
</script>
{% endblock %}
