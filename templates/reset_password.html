{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow border-0" style="width: 100%; max-width: 450px; border-radius: 12px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success">Verified!</h2>
                <h5 class="text-muted">Create New Password</h5>
            </div>
            
            <p class="text-center text-muted mb-4" style="font-size: 0.95rem;">
                Your identity has been verified. Please enter a strong new password for your account.
            </p>

            <form method="POST" action="{{ url_for('set_new_password') }}">
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold text-secondary">New Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-bold text-secondary">Confirm New Password</label>
                    <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" placeholder="Retype password" required minlength="8">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg fw-bold">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
