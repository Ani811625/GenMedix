{% extends "base.html" %}
{% block title %}Set New Password - GenMedix{% endblock %}

{% block content %}
<style>
    .sec-wrapper { min-height: calc(100vh - 76px); display: flex; align-items: center; justify-content: center; background-color: #f8fafc; padding: 20px; }
    .sec-card { max-width: 420px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; background: #fff; padding: 40px; }
</style>

<div class="sec-wrapper">
    <div class="sec-card text-center">
        <div class="mb-4">
            <i class="fas fa-key text-primary fs-1 mb-3"></i>
            <h4 class="fw-bold text-dark">Set New Password</h4>
            <p class="text-muted small">Identity verified. Please create a strong, new password for your account.</p>
        </div>

        <form method="POST" action="{{ url_for('set_new_password') }}">
            <div class="form-floating mb-3 text-start">
                <input type="password" class="form-control" id="password" name="password" placeholder="New Password" required minlength="6">
                <label for="password">New Password</label>
            </div>
            
            <div class="form-floating mb-4 text-start">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required minlength="6">
                <label for="confirm_password">Confirm New Password</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
